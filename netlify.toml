[build]
  base = "web"
  command = "npm run build"

[functions]
  # Relative to build.base: user functions (the keep-warm scheduler) live in
  # web/netlify/functions, separate from the Next.js plugin's internal ones.
  directory = "netlify/functions"

[build.environment]
  NODE_VERSION = "24"

[context.production.environment]
  NEXT_TELEMETRY_DISABLED = "1"

# The @netlify/plugin-nextjs v5 runtime manages the publish directory itself;
# an explicit `publish` here resolves wrong from CI and breaks the deploy.
[[plugins]]
  package = "@netlify/plugin-nextjs"
