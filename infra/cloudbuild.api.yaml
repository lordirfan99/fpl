# Monorepo: build + deploy the read-only API to Cloud Run (fpl-scout-api).
# Scheduled-tasks / live-refresh jobs are NOT handled here — they are rebuilt
# separately when the scheduler machinery is un-frozen (docs/MIGRATION.md).
#
# data/ is supplied by the build context (repo-root, gitignored) as a snapshot
# fallback; GCS (FPL_SNAPSHOT_BUCKET) is the primary store.
steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --file=api/Dockerfile
      - --tag=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/fpl-scout-api:$BUILD_ID
      - .
  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/fpl-scout-api:$BUILD_ID
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - fpl-scout-api
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/fpl-scout-api:$BUILD_ID
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      # Full-league snapshots can be tens of MB in memory. Isolate heavy reads
      # per 512 MiB instance instead of paying for a larger always-allocated
      # memory tier or allowing unrelated requests to terminate each other.
      - --concurrency=1
      # Preserve separately managed server-only secrets and private-bucket
      # bindings. --set-env-vars clears every variable not listed here.
      - --update-env-vars=FPL_MY_TEAM_ID=2797967,FPL_DEFAULT_LEAGUE_ID=58005,FPL_SNAPSHOT_BUCKET=irfan-374115-fpl-snapshots,FPL_GIT_SHA=${_GIT_SHA}

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/fpl-scout-api:$BUILD_ID

substitutions:
  _REGION: us-central1
  _REPOSITORY: fpl-scout
  _GIT_SHA: unknown

options:
  logging: CLOUD_LOGGING_ONLY
