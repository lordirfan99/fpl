# Legacy manual task image only; live refresh runs on the VM.
# Job configuration (args, service account and limits) is preserved when an
# operator runs `gcloud run jobs update --image ...` during the cutover.
steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --file=api/Dockerfile.tasks
      - --tag=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/fpl-scheduled-tasks:${_GIT_SHA}
      - .
  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/fpl-scheduled-tasks:${_GIT_SHA}

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/fpl-scheduled-tasks:${_GIT_SHA}

substitutions:
  _REGION: us-central1
  _REPOSITORY: fpl-scout
  _GIT_SHA: unknown

options:
  logging: CLOUD_LOGGING_ONLY
