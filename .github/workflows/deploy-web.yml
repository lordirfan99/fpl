name: deploy · web to Netlify

# Replaces the manual `netlify deploy`. Builds web/ with the Next.js plugin and
# deploys reviewed release tags to production, following AGENTS.md.
# Only secret required: NETLIFY_AUTH_TOKEN. The Site ID below is a public
# identifier (it lives in .netlify/state.json), not a credential.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-web
  cancel-in-progress: true

env:
  NETLIFY_SITE_ID: e2602e61-b56a-45ff-8f01-debe6037af2e

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Guard — tagged release required
        if: github.ref_type != 'tag'
        run: echo 'Deploy a reviewed release tag.' && exit 1
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Guard — token present
        run: |
          if [ -z "${NETLIFY_AUTH_TOKEN}" ]; then
            echo "::error::Set repo secret NETLIFY_AUTH_TOKEN first."
            exit 1
          fi
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      - name: Install deps
        run: npm ci
      - name: Build + deploy (production)
        run: >-
          npx --yes netlify-cli@17 deploy --build --prod
          --site "$NETLIFY_SITE_ID"
          --message "CI ${{ github.sha }}"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
