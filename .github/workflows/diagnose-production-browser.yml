name: diagnose · production real-browser audit

# PR-only: read-only request/interaction inspection on public production URLs.
on:
  pull_request:
    paths:
      - web/scripts/production-audit.mjs
      - .github/workflows/diagnose-production-browser.yml

permissions:
  contents: read

jobs:
  browser-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run real desktop and mobile audit (read-only)
        run: node scripts/production-audit.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fpl-production-browser-audit
          path: web/production-audit-artifacts/
          retention-days: 7
