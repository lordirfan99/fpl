name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: engine / api / bot — lint + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest
          # per-module requirements (present after Phase B); tolerate absence during skeleton
          for r in api/requirements.txt engine/requirements.txt bot/requirements.txt requirements.txt; do
            [ -f "$r" ] && pip install -r "$r" || true
          done
      - name: Lint
        run: ruff check . || { echo "::error::ruff failed"; exit 1; }
      - name: Validate VM live-refresh release scripts and timer
        run: |
          bash -n infra/deploy/install-live-refresh.sh
          bash -n infra/deploy/install-recommendation-planner.sh
          bash -n infra/deploy/install-private-dashboard.sh
          schedule=$(sed -n 's/^OnCalendar=//p' infra/deploy/gcp/systemd/fpl-live-refresh.timer)
          test -n "$schedule"
          systemd-analyze calendar "$schedule"
      - name: Tests
        run: |
          # testpaths come from pyproject.toml; exit 5 = "no tests collected" (skeleton) is OK
          pytest -q; rc=$?
          if [ $rc -eq 5 ]; then echo "no tests collected yet — passing"; exit 0; fi
          exit $rc

  web:
    name: web — build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build
        env:
          FPL_API_BASE_URL: http://localhost:8080
          FPL_DATA_BASE_URL: http://localhost:8080/data
        run: |
          if [ -f web/package.json ]; then
            cd web && npm ci && npx playwright test --config playwright.unit.config.ts && npm run typecheck && npm run build
            npx playwright install --with-deps chromium
            npx playwright test --config playwright.decision.config.ts
          else
            echo "no web/ yet (skeleton) — passing"
          fi
