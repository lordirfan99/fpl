name: Dashboard route audit
on:
  push:
    branches: [fix/dashboard-page-data-contracts]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect public data contracts
        shell: python
        run: |
          import urllib.request, json, time
          base = "https://sportmania.duckdns.org/fpl-scout-api"
          paths = ["/health", "/ready", "/v1/catalog/compact", "/v1/leagues/58005?gw=6"]
          for path in paths:
              started = time.monotonic()
              try:
                  with urllib.request.urlopen(urllib.request.Request(base + path, headers={"User-Agent": "FPLScoutMonitor/1.0"}), timeout=30) as response:
                      data = response.read()
                      value = json.loads(data)
                      print(path, response.status, len(data), round(time.monotonic()-started, 2), "keys", list(value))
                      managers = value.get("managers", [])
                      if managers:
                          print("manager keys", list(managers[0]))
                          print("missing squads", sum(not isinstance(m.get("squad"), list) for m in managers))
                          print("chip types", sorted(set(type(c).__name__ for m in managers for c in (m.get("chips_used") or []))))
                          print("transfer types", sorted(set(type(c).__name__ for m in managers for c in (m.get("transfer_details") or []))))
                      players = value.get("players", [])
                      if players:
                          print("missing player names", sum(not isinstance(p.get("web_name"), str) for p in players))
              except Exception as error:
                  print(path, type(error).__name__, str(error), round(time.monotonic()-started, 2))
      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Read-only VM resource diagnosis
        timeout-minutes: 3
        run: |
          gcloud compute instances describe instance-20260412-121200 --project=irfan-374115 --zone=us-central1-a --format='value(status,machineType)'
          gcloud compute ssh instance-20260412-121200 --project=irfan-374115 --zone=us-central1-a --tunnel-through-iap --ssh-key-expire-after=10m --quiet --command='uptime; free -m; ps -eo pid,comm,%cpu,%mem --sort=-%cpu | head -12; systemctl show fpl-scout-api.service fpl-live-refresh.service fpl-auto-runner.service --property=ActiveState,SubState,MemoryCurrent,CPUUsageNSec; curl -sS --max-time 3 http://127.0.0.1:8790/health'
